<svg xmlns="http://www.w3.org/2000/svg" width="2025" height="220" viewBox="0 0 2025 220" font-family="DejaVu Sans">
<rect x="0" y="0" width="2025" height="220" fill="#FFFFFF"/>
<rect x="30" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="120.0" y="107.0" text-anchor="middle" font-size="12" fill="#FFFFFF">kitten.jpeg</text>
<text x="120.0" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">(published image)</text>
<rect x="325" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="415.0" y="115.0" text-anchor="middle" font-size="12" fill="#FFFFFF">base64 string</text>
<rect x="620" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="710.0" y="115.0" text-anchor="middle" font-size="12" fill="#FFFFFF">sha256 digest</text>
<rect x="915" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="1005.0" y="107.0" text-anchor="middle" font-size="12" fill="#FFFFFF">24-word mnemonic</text>
<text x="1005.0" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">(FIXED, public)</text>
<rect x="1210" y="80" width="195" height="60" rx="8" fill="#E07A1F" stroke="#8a4a10" stroke-width="1.5"/>
<text x="1307.5" y="107.0" text-anchor="middle" font-size="12" fill="#FFFFFF">seed</text>
<text x="1307.5" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">(mnemonic + passphrase)</text>
<rect x="1520" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="1610.0" y="107.0" text-anchor="middle" font-size="12" fill="#FFFFFF">key pair</text>
<text x="1610.0" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">m/84'/0'/0'/0/0</text>
<rect x="1815" y="80" width="180" height="60" rx="8" fill="#1F5FBF" stroke="#14406e" stroke-width="1.5"/>
<text x="1905.0" y="107.0" text-anchor="middle" font-size="12" fill="#FFFFFF">P2WPKH address</text>
<text x="1905.0" y="123.0" text-anchor="middle" font-size="12" fill="#FFFFFF">(bech32)</text>
<line x1="210" y1="110.0" x2="317" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="267.5" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">base64 encode</text>
<line x1="505" y1="110.0" x2="612" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="562.5" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">sha256</text>
<line x1="800" y1="110.0" x2="907" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="857.5" y="86.0" text-anchor="middle" font-size="9.5" fill="#333333">BIP39 entropy</text>
<text x="857.5" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">to mnemonic</text>
<line x1="1095" y1="110.0" x2="1202" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1152.5" y="86.0" text-anchor="middle" font-size="9.5" fill="#333333">PBKDF2-SHA512</text>
<text x="1152.5" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">(2048 rounds)</text>
<line x1="1405" y1="110.0" x2="1512" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1462.5" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">BIP32</text>
<line x1="1700" y1="110.0" x2="1807" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1757.5" y="98.0" text-anchor="middle" font-size="9.5" fill="#333333">HASH160 + bech32</text>
<rect x="30" y="194" width="14" height="14" fill="#E07A1F"/>
<text x="50" y="205" font-size="11" fill="#111111">the passphrase is the only unknown input, entered here</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333333"/></marker></defs>
</svg>