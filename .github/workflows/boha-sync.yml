name: boha sync

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: boha-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export the latest boha dataset
        run: |
          npm install --no-save @agntn/puzzles@latest
          npx puzzles export > "$RUNNER_TEMP/boha-export.json"
      - name: Sync the unsolved watchlist
        run: python3 tools/boha_sync.py --export "$RUNNER_TEMP/boha-export.json"
      - name: Open a pull request if the watchlist changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "boha: sync unsolved watchlist"
          title: "boha: sync unsolved watchlist"
          body: |
            Automated sync of the boha unsolved watchlist.

            This pull request was generated by `.github/workflows/boha-sync.yml`.
            It contains only changes under `boha/`: new unsolved records, records
            that are no longer unsolved, and refreshed live checks for new
            addresses.
          branch: boha-sync
          delete-branch: true
          add-paths: |
            README.md
            assets/boha-prize-map.svg
            boha/
